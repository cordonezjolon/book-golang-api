---
- name: Deploy books-go-api
  hosts: targetnode

  tasks:
    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Render docker-compose.yml
      ansible.builtin.template:
        src: templates/docker-compose.yml
        dest: "{{ deploy_dir }}/docker-compose.yml"
        mode: "0644"

    - name: Pull the new image
      ansible.builtin.command: podman-compose pull
      args:
        chdir: "{{ deploy_dir }}"

    - name: Recreate containers with the new image
      ansible.builtin.command: podman-compose up -d
      args:
        chdir: "{{ deploy_dir }}"

    - name: Wait for the app to start listening
      ansible.builtin.wait_for:
        port: "{{ app_port }}"
        timeout: 30
