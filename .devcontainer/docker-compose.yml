services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    tty: true
    stdin_open: true
    volumes:
      - ..:/workspace:cached
    ports:
      - "2345:2345"
    depends_on:
      - postgres
    environment:
      - GO111MODULE=on
      - GOPATH=/go
      - GOCACHE=/go/cache
      - PATH=/go/bin:/usr/local/go/bin:${PATH}

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
